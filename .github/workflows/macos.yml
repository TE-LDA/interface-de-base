name: macOS Calculator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Verify app launches
        run: |
          swift build -c release
          APP=$(swift build -c release --show-bin-path)/Calculator
          codesign --force --deep --sign - "$APP"
          "$APP" &
          APP_PID=$!
          sleep 5
          if kill -0 $APP_PID 2>/dev/null; then
            echo "L'application Calculator s'est lancée avec succès."
            kill $APP_PID
          else
            echo "::error::L'application n'a pas survécu 5 secondes."
            exit 1
          fi
